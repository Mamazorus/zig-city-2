name: Build The Dirty Stuff mod

# Compile le portage NeoForge "thedirtystuff" et publie le .jar.
# Se declenche sur les push de la branche main touchant le mod, et manuellement.
on:
  push:
    branches:
      - main
    paths:
      - 'thedirtystuff-neoforge/**'
      - '.github/workflows/thedirtystuff.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ModDevGradle 2.0.x -> Gradle 8.12 (comme zig-addiction / zig-shop-mod).
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        working-directory: thedirtystuff-neoforge
        run: gradle build --no-daemon --stacktrace

      - name: Publier le .jar (artefact, filet de secours)
        uses: actions/upload-artifact@v4
        with:
          name: thedirtystuff-jar
          path: thedirtystuff-neoforge/build/libs/*.jar
          if-no-files-found: error

      # Depose le .jar buildé sur la branche mod-jars (raw), d'ou le launcher le telecharge
      # (cf. raw-launcher/modpack.json). On AJOUTE le jar versionne (on garde les anciens).
      # Seulement sur main : les pushes de branches/PR ne publient pas.
      - name: Deposer le .jar sur la branche mod-jars
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          JAR=$(ls thedirtystuff-neoforge/build/libs/thedirtystuff-*.jar | grep -v -- '-sources' | head -1)
          test -n "$JAR" || { echo "::error::jar introuvable dans build/libs"; exit 1; }
          NAME=$(basename "$JAR")
          echo "Depot de $NAME sur mod-jars"
          cp "$JAR" "$RUNNER_TEMP/$NAME"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin mod-jars:mod-jars
          git checkout mod-jars
          cp "$RUNNER_TEMP/$NAME" "./$NAME"
          git add "$NAME"
          if git diff --cached --quiet; then
            echo "Aucun changement ($NAME deja present) — rien a pousser."
          else
            git commit -m "build: $NAME (CI)"
            git push origin mod-jars
          fi
